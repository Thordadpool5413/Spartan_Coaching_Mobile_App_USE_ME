#  Render Blueprint for Spartan Coaching Backend
#  Push this repo to GitHub, then visit https://dashboard.render.com/blueprints
#  and click "New Blueprint" pointing at the repo. Render will create the
#  service from this file. After it provisions, set the secrets noted below.

services:
  - type: web
    name: spartan-coaching-api
    runtime: docker
    plan: starter        # $7/mo. Use "free" for $0 (sleeps after 15 min idle).
    region: oregon       # Or "frankfurt", "singapore", "ohio", etc.
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # ---- Configured automatically (placeholders, replace via Render dashboard) ----
      - key: PORT
        value: "10000"   # Render's default. uvicorn binds to ${PORT}
      - key: DB_NAME
        value: spartan_coaching
      - key: LLM_MODEL
        value: gpt-4o
      - key: LLM_MODEL_FAST
        value: gpt-4o-mini
      - key: CONTACT_EMAIL
        value: nick@spartanhospicecoaching.com
      - key: RESEND_FROM_NAME
        value: Spartan Coaching
      # ---- Secrets to set in Render dashboard (sync: false) ----
      - key: MONGO_URL
        sync: false       # Atlas connection string (mongodb+srv://...)
      - key: EMERGENT_LLM_KEY
        sync: false       # sk-emergent-...
      - key: RESEND_API_KEY
        sync: false       # re_...
      - key: RESEND_FROM_EMAIL
        sync: false       # noreply@spartanhospicecoaching.com (after domain verified)
      - key: ADMIN_TOKEN
        generateValue: true   # Render auto-generates a strong random secret
      - key: CORS_ALLOWED_ORIGINS
        sync: false       # https://app.spartanhospicecoaching.com,https://spartan-coaching.onrender.com
